[project]
name = "eva-cli"
version = "0.1.0"
description = "CLI y servidor MCP para el EVA FING (Moodle) — acceso headless para humanos y agentes de IA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "rich>=13.7",
]

[project.scripts]
eva = "eva_cli.cli:app"
eva-mcp = "eva_cli.mcp_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
mcp = [
    "fastmcp>=3.0",
    "mcp>=1.6",
    "pywin32>=306; platform_system == 'Windows'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eva_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Conjunto explícito (independiente del default de ruff, que varía entre versiones).
# E/W  = pycodestyle · F = pyflakes · I = isort · UP = pyupgrade · B = bugbear
# SIM = flake8-simplify · RUF = reglas específicas de ruff
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
